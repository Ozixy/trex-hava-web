<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hava Durumu Yönetim Paneli</title>
    <style>
        :root {
            --primary-green: #10b981;
            --primary-hover: #059669;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #022c22;
            border-bottom: 2px solid var(--primary-green);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-green);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .container {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Kontrol Paneli Alanı */
        .controls {
            display: flex;
            gap: 25px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            align-items: flex-end;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .control-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .controls label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .controls select {
            background: #0b1329;
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .controls select:hover, .controls select:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        /* Metrik Kartları */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .metric-title {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .metric-value {
            font-size: 32px;
            font-weight: bold;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .trend-arrow {
            font-size: 24px;
            font-weight: bold;
        }
        .trend-up { color: #22c55e; }
        .trend-down { color: #ef4444; }
        
        /* Log Tablosu Alanı */
        .log-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .log-section h3 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            color: var(--text-light);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 10px;
        }
        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        th {
            color: var(--text-muted);
            font-weight: 600;
            background-color: rgba(15, 23, 42, 0.5);
        }
        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>🟢 TREX HAVA YÖNETİM PANELİ</span>
        </div>
        <div style="font-size: 14px; color: var(--text-muted);">Sistem Durumu: <span style="color: var(--primary-green); font-weight: 600;">● Canlı İzleme</span></div>
    </header>

    <div class="container">
        <!-- Kurumsal Kontrol Paneli -->
        <div class="controls">
            <div class="control-group">
                <label for="ulkeSelect">Ülke Seçimi</label>
                <select id="ulkeSelect" onchange="sehirleriGuncelle()">
                    {% for ulke in ulkeler %}
                    <option value="{{ ulke }}" {% if ulke == 'Türkiye' %}selected{% endif %}>{{ ulke }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="control-group">
                <label for="sehirSelect">Şehir / İl Seçimi (81 İl ve Avrupa)</label>
                <select id="sehirSelect" onchange="havaVerisiniCek()">
                    <!-- Dinamik olarak dolacak -->
                </select>
            </div>
        </div>

        <!-- Metrik Kartları -->
        <div class="card-grid">
            <div class="metric-card">
                <div class="metric-title">Seçilen Aktif Konum</div>
                <div class="metric-value" id="lblKonum" style="font-size: 26px;">Türkiye / Bursa</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Anlık Sıcaklık</div>
                <div class="metric-value">
                    <span id="lblSicaklik">--</span>°C 
                    <span id="lblTrend" class="trend-arrow"></span>
                </div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Hava Durumu Durumu</div>
                <div class="metric-value" id="lblDurum" style="font-size: 28px;">-- ☁️</div>
            </div>
        </div>

        <!-- Son Olaylar / Log Tablosu -->
        <div class="log-section">
            <h3>Anlık Değişim ve Olay Akışı (Log)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Zaman</th>
                        <th>Konum</th>
                        <th>Eski Değer</th>
                        <th>Yeni Değer</th>
                        <th>Durum Özeti</th>
                    </tr>
                </thead>
                <tbody id="logTablosu">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-muted);">Veri akışı bekleniyor. Şehir seçimi yapıldı veya güncellendi.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let eskiSicaklik = null;

        function sehirleriGuncelle() {
            const ulke = document.getElementById("ulkeSelect").value;
            fetch(`/api/sehirler?ulke=${encodeURIComponent(ulke)}`)
                .then(res => res.json())
                .then(data => {
                    const sehirSelect = document.getElementById("sehirSelect");
                    sehirSelect.innerHTML = "";
                    data.forEach(sehir => {
                        let opt = document.createElement("option");
                        opt.value = sehir;
                        opt.textContent = sehir;
                        sehirSelect.appendChild(opt);
                    });
                    // İlk şehri seçip hava durumunu çek
                    havaVerisiniCek();
                });
        }

        function havaVerisiniCek() {
            const ulke = document.getElementById("ulkeSelect").value;
            const sehir = document.getElementById("sehirSelect").value;
            if (!sehir) return;

            fetch(`/api/hava?ulke=${encodeURIComponent(ulke)}&sehir=${encodeURIComponent(sehir)}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById("lblKonum").textContent = `${data.ulke} / ${data.sehir}`;
                    document.getElementById("lblDurum").textContent = `${data.durum} ${data.ikon}`;
                    
                    const yeniSicaklik = parseFloat(data.sicaklik);
                    document.getElementById("lblSicaklik").textContent = yeniSicaklik;

                    const trendEl = document.getElementById("lblTrend");
                    
                    if (eskiSicaklik !== null && eskiSicaklik !== yeniSicaklik) {
                        let zaman = new Date().toLocaleTimeString();
                        let okIsareti = "";
                        
                        if (yeniSicaklik > eskiSicaklik) {
                            okIsareti = "↑";
                            trendEl.className = "trend-arrow trend-up";
                            trendEl.textContent = "↑";
                        } else {
                            okIsareti = "↓";
                            trendEl.className = "trend-arrow trend-down";
                            trendEl.textContent = "↓";
                        }

                        const tbody = document.getElementById("logTablosu");
                        if (tbody.querySelector("td[colspan]")) {
                            tbody.innerHTML = "";
                        }

                        let yeniSatir = `<tr>
                            <td>${zaman}</td>
                            <td>${data.sehir}, ${data.ulke}</td>
                            <td>${eskiSicaklik}°C</td>
                            <td>${yeniSicaklik}°C <span class="${okIsareti === '↑' ? 'trend-up' : 'trend-down'}">${okIsareti}</span></td>
                            <td>${data.durum} ${data.ikon}</td>
                        </tr>`;
                        tbody.insertAdjacentHTML('afterbegin', yeniSatir);
                    } else if (eskiSicaklik === yeniSicaklik) {
                        trendEl.textContent = "";
                    }

                    eskiSicaklik = yeniSicaklik;
                });
        }

        // Sayfa ilk yüklendiğinde çalışacak
        window.onload = function() {
            sehirleriGuncelle();
            // Her 30 saniyede bir otomatik veri tazeleme
            setInterval(havaVerisiniCek, 30000);
        };
    </script>
</body>
</html>
